<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(165deg, #f5f3f0 0%, #faf9f7 40%, #f2f1f4 100%);
            color: #1c1917;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 100px 0 120px;
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 80% 60% at 20% 80%, rgba(180, 170, 200, 0.18), transparent),
                radial-gradient(ellipse 50% 50% at 85% 15%, rgba(200, 190, 180, 0.12), transparent);
            z-index: 0;
        }

        .container {
            width: 640px;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            padding: 36px 44px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
        }

        h1 {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.3px;
            margin-bottom: 32px;
            color: #292524;
        }

        .label {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a8a29e;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 108px;
            padding: 14px 0;
            border: none;
            border-bottom: 1.5px solid #e7e5e4;
            border-radius: 0;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.7;
            color: #1c1917;
            background: transparent;
            outline: none;
            resize: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-bottom-color: #1c1917;
        }
        textarea::placeholder {
            color: #d6d3d1;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }
        .chars {
            font-size: 12px;
            color: #a8a29e;
            font-variant-numeric: tabular-nums;
        }
        button {
            padding: 8px 24px;
            background: #1c1917;
            color: #fafaf9;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: background 0.15s;
        }
        button:hover { background: #292524; }
        button:disabled {
            background: #d6d3d1;
            cursor: not-allowed;
        }

        #response {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #f0efed;
            font-size: 14px;
            line-height: 1.9;
            color: #44403c;
            min-height: 24px;
            transition: color 0.2s;
        }
        #response h2 { font-size: 16px; font-weight: 600; color: #1c1917; margin: 28px 0 8px; }
        #response h3 { font-size: 14px; font-weight: 600; color: #292524; margin: 20px 0 6px; }
        #response p { margin: 0 0 12px; }
        #response ul, #response ol { padding-left: 20px; margin: 0 0 12px; }
        #response li { margin-bottom: 4px; }
        #response code {
            font-family: 'SF Mono', 'Cascadia Code', monospace;
            font-size: 12.5px;
            background: #f0efed;
            padding: 2px 5px;
            border-radius: 3px;
        }
        #response pre {
            background: #f5f5f4;
            padding: 14px 16px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 0 0 16px;
            line-height: 1.6;
        }
        #response pre code {
            background: none;
            padding: 0;
        }
        #response blockquote {
            border-left: 2px solid #e7e5e4;
            padding-left: 14px;
            color: #78716c;
            margin: 0 0 12px;
        }
        #response strong { color: #1c1917; }
        #response table {
            border-collapse: collapse;
            margin: 0 0 16px;
            width: 100%;
            font-size: 13px;
        }
        #response th, #response td {
            border: 1px solid #e7e5e4;
            padding: 8px 12px;
            text-align: left;
        }
        #response th { background: #f5f5f4; font-weight: 500; }
        #response.loading {
            color: #a8a29e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot-wave {
            display: inline-flex;
            gap: 3px;
        }
        .dot-wave span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #d6d3d1;
            animation: wave 1.2s ease-in-out infinite;
        }
        .dot-wave span:nth-child(2) { animation-delay: 0.2s; }
        .dot-wave span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 60%, 100% { opacity: 0.2; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-3px); }
        }

        .timer {
            font-size: 12px;
            color: #d6d3d1;
            font-variant-numeric: tabular-nums;
            margin-left: 4px;
        }

        #response.error  { color: #dc2626; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>Chat</h1>

    <div class="label">Prompt</div>
    <textarea id="prompt" placeholder="输入后 Ctrl+Enter 发送..."></textarea>
    <div class="meta">
        <span class="chars" id="count">0 / 200</span>
        <button onclick="send()" id="btn">发送</button>
    </div>

    <div id="response"></div>
</div>

<script>
    const TOKEN = 'kskbl,zdjd';

    async function send() {
        const prompt = document.getElementById('prompt').value.trim();
        if (!prompt) return;

        const btn = document.getElementById('btn');
        const box = document.getElementById('response');
        btn.disabled = true;
        btn.textContent = '发送中…';

        box.className = 'loading';
        box.innerHTML = '<span>思考中</span><span class="dot-wave"><span></span><span></span><span></span></span><span class="timer" id="timer"></span>';

        const start = Date.now();
        const timerEl = document.getElementById('timer');
        const tick = setInterval(() => {
            const s = ((Date.now() - start) / 1000).toFixed(1);
            timerEl.textContent = s + 's';
        }, 100);

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${TOKEN}`,
                },
                body: JSON.stringify({ user_prompt: prompt }),
            });
            const data = await res.json();
            clearInterval(tick);

            if (data.result) {
                box.className = '';
                box.innerHTML = marked.parse(data.result);
                const s = ((Date.now() - start) / 1000).toFixed(1);
                btn.textContent = '发送 (' + s + 's)';
                setTimeout(() => { btn.textContent = '发送'; }, 2000);
            } else {
                box.className = 'error';
                box.textContent = data.error || JSON.stringify(data);
                btn.textContent = '发送';
            }
        } catch (e) {
            clearInterval(tick);
            box.className = 'error';
            box.textContent = e.message;
            btn.textContent = '发送';
        } finally {
            btn.disabled = false;
        }
    }

    const ta = document.getElementById('prompt');
    const count = document.getElementById('count');
    ta.addEventListener('input', () => count.textContent = ta.value.length + ' / 200');
    ta.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') send();
    });
</script>
</body>
</html>
